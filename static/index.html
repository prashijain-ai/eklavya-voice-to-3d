const DC={table:"#8b5a2b",sofa:"#6d7b8d",bed:"#c9b79c",lamp:"#e9c46a",plant:"#4f8a4b",cupboard:"#7a4e2d",chair:"#8b5a2b",window:"#8b5a2b",door:"#6b4226",tv:"#1b1b1f",bookshelf:"#7a4e2d",rug:"#b5483a",fan:"#e8e2d0",painting:"#caa45a"};
function build(o){const g=new THREE.Group(),[w,h,d]=DIM[o.type],c=o.color||DC[o.type];
 if(o.type=="table"){g.add(box(w,.25,d,c,0,h,0));[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>g.add(box(.25,h,.25,c,a*(w/2-.3),h/2,b*(d/2-.3))))}
 else if(o.type=="chair"){g.add(box(w,.2,d,c,0,1.6,0),box(w,1.6,.2,c,0,2.4,-d/2),...[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>box(.2,1.6,.2,c,a*.6,.8,b*.6)))}

 else if(o.type=="window"){g.add(box(w,h,.3,c,0,0,0),box(w-.5,h-.5,.32,"#9fd3ff",0,0,0,{transparent:true,opacity:.55,emissive:"#6ab7ff",emissiveIntensity:.3}))}

 else if(o.type=="rug"){g.add(box(w,.06,d,c,0,.03,0),box(w-1.2,.075,d-1.2,"#e0b872",0,.04,0))}

 g.userData.ink=[];g.traverse(m=>{if(m.isMesh&&m.geometry.type=="BoxGeometry"){const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0xf2a541,transparent:true,opacity:1}));m.add(l);g.userData.ink.push(l.material)}});return g}
function label(txt,x,y,z){const c=document.createElement("canvas");c.width=256;c.height=64;const t=c.getContext("2d");t.font="500 34px Fraunces,serif";t.fillStyle="#f3ead7";t.textAlign="center";t.fillText(txt,128,44);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(4,1,1);s.position.set(x,y,z);return s}
function render(){group.clear();const r=scene.room;
 group.add(box(r.w,.2,r.l,r.floorColor,0,-.1,0));
 [["north",0,-r.l/2,r.w,0],["south",0,r.l/2,r.w,0],["west",-r.w/2,0,r.l,1],["east",r.w/2,0,r.l,1]].forEach(([n,x,z,len,rot])=>group.add(box(rot?.2:len,r.h,rot?len:.2,r.wallColor,x,r.h/2,z,{transparent:true,opacity:(n=="south"||n=="east")?.14:.96})));
 const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(r.w,r.h,r.l)),new THREE.LineBasicMaterial({color:0xf3ead7,transparent:true,opacity:.55}));e.position.y=r.h/2;group.add(e);

  if(WALLED.includes(o.type)){const y=o.type=="window"?r.h/2+.5:o.type=="painting"?5.5:3.5,off=o.pos[0]||0,P={north:[off,y,-r.l/2+.2,0],south:[off,y,r.l/2-.2,Math.PI],west:[-r.w/2+.2,y,off,Math.PI/2],east:[r.w/2-.2,y,off,-Math.PI/2]}[o.wall||"west"]||[0,y,0,0];g.position.set(P[0],P[1],P[2]);g.rotation.y=P[3]}

function wav(buf){const d=buf.getChannelData(0),o=new DataView(new ArrayBuffer(44+d.length*2)),w=(i,s)=>[...s].forEach((c,k)=>o.setUint8(i+k,c.charCodeAt(0)));

let rec,chunks,an,ctx,raf,sr,btxt='';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const orb=$("orb");
async function start(){if(rec&&rec.state=="recording")return;try{const st=await navigator.mediaDevices.getUserMedia({audio:{noiseSuppression:true,echoCancellation:true}});

 ctx=new AudioContext();an=ctx.createAnalyser();an.fftSize=256;ctx.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.frequencyBinCount);
 (function lv(){an.getByteFrequencyData(buf);orb.style.setProperty("--lvl",(buf.reduce((a,b)=>a+b,0)/buf.length/110).toFixed(2));raf=requestAnimationFrame(lv)})();
